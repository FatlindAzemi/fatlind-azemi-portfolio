<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#0b0b0d" />
    <script>
      // Resolve the language before first paint so German visitors never see an
      // English flash. Mirrors the logic in src/i18n/LanguageProvider.tsx.
      ;(function () {
        try {
          var stored = localStorage.getItem('portfolio-locale')
          if (stored === 'en' || stored === 'de') {
            document.documentElement.lang = stored
            return
          }
        } catch (error) {}
        var languages =
          navigator.languages && navigator.languages.length
            ? navigator.languages
            : [navigator.language]
        document.documentElement.lang = languages.some(function (language) {
          return language.toLowerCase().indexOf('de') === 0
        })
          ? 'de'
          : 'en'
      })()
    </script>
    <title>Fatlind Azemi — Software &amp; Data Engineer</title>
    <meta name="description" content="Portfolio of Fatlind Azemi, Software &amp; Data Engineer specializing in enterprise data infrastructure and modern application development." />

    <!-- Open Graph -->
    <!-- Canonical domain — keep in sync with sitemap.xml and robots.txt -->
    <meta property="og:title" content="Fatlind Azemi — Software &amp; Data Engineer" />
    <meta property="og:description" content="Portfolio of Fatlind Azemi, Software &amp; Data Engineer specializing in enterprise data infrastructure and modern application development." />
    <meta property="og:type" content="website" />
    <meta property="og:url" content="https://fatlind-azemi.de" />
    <meta property="og:site_name" content="Fatlind Azemi" />
    <meta property="og:locale" content="en" />
    <meta property="og:locale:alternate" content="de_DE" />
    <meta property="og:image" content="https://fatlind-azemi.de/og-image.jpg" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:image:alt" content="Fatlind Azemi — Software &amp; Data Engineer" />

    <!-- Twitter Card -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Fatlind Azemi — Software &amp; Data Engineer" />
    <meta name="twitter:description" content="Portfolio of Fatlind Azemi, Software &amp; Data Engineer specializing in enterprise data infrastructure and modern application development." />
    <meta name="twitter:image" content="https://fatlind-azemi.de/og-image.jpg" />

    <!-- Canonical -->
    <link rel="canonical" href="https://fatlind-azemi.de" />

    <!-- Robots -->
    <meta name="robots" content="index, follow" />

    <!-- Favicon -->
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />

    <!-- The hero portrait is referenced from JS, so the browser only discovers
         it once the bundle has run. Preload it to keep it out of the LCP path. -->
    <link rel="preload" href="/portrait.jpg" as="image" fetchpriority="high" />

    <!-- Fonts are self-hosted: no request to Google, no third-party data transfer -->
    <link
      rel="preload"
      href="/fonts/inter.woff2"
      as="font"
      type="font/woff2"
      crossorigin
    />
    <link
      rel="preload"
      href="/fonts/geist-mono.woff2"
      as="font"
      type="font/woff2"
      crossorigin
    />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
