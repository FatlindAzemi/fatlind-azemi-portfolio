<!doctype html>
<html lang="de">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#0b0b0d" />
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; font-src 'self'; connect-src 'self'; base-uri 'self'; form-action 'self'"
    />
    <!-- Content is animated in with JavaScript. Without JS (or when a crawler
         does not run it) the prerendered markup sits at opacity:0; force it to
         its final state so nobody sees a blank page. -->
    <noscript>
      <style>
        #root [style*="opacity:0"] { opacity: 1 !important; }
        #root [style*="transform:translateY"] { transform: none !important; }
      </style>
    </noscript>

    <title>Fatlind Azemi — Software- &amp; Data-Engineer</title>
    <meta name="description" content="Portfolio von Fatlind Azemi, Software- und Data-Engineer mit Fokus auf Enterprise-Dateninfrastruktur und moderne Anwendungsentwicklung." />

    <!-- Open Graph -->
    <!-- Canonical domain — keep in sync with sitemap.xml and robots.txt -->
    <meta property="og:title" content="Fatlind Azemi — Software- &amp; Data-Engineer" />
    <meta property="og:description" content="Portfolio von Fatlind Azemi, Software- und Data-Engineer mit Fokus auf Enterprise-Dateninfrastruktur und moderne Anwendungsentwicklung." />
    <meta property="og:type" content="website" />
    <meta property="og:url" content="https://fatlind-azemi.de/" />
    <meta property="og:site_name" content="Fatlind Azemi" />
    <meta property="og:locale" content="de_DE" />
    <meta property="og:locale:alternate" content="en_US" />
    <meta property="og:image" content="https://fatlind-azemi.de/og-image.jpg" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:image:alt" content="Fatlind Azemi — Software- &amp; Data-Engineer" />

    <!-- Twitter Card -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Fatlind Azemi — Software- &amp; Data-Engineer" />
    <meta name="twitter:description" content="Portfolio von Fatlind Azemi, Software- und Data-Engineer mit Fokus auf Enterprise-Dateninfrastruktur und moderne Anwendungsentwicklung." />
    <meta name="twitter:image" content="https://fatlind-azemi.de/og-image.jpg" />

    <!-- Canonical -->
    <link rel="canonical" href="https://fatlind-azemi.de/" />

    <!-- Robots -->
    <meta name="robots" content="index, follow" />

    <!-- Favicon -->
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />

    <!-- The hero portrait is referenced from JS, so the browser only discovers
         it once the bundle has run. Preload it to keep it out of the LCP path. -->
    <link rel="preload" href="/portrait.jpg" as="image" fetchpriority="high" />

    <!-- Fonts are self-hosted: no request to Google, no third-party data transfer -->
    <link
      rel="preload"
      href="/fonts/inter.woff2"
      as="font"
      type="font/woff2"
      crossorigin
    />
    <link
      rel="preload"
      href="/fonts/geist-mono.woff2"
      as="font"
      type="font/woff2"
      crossorigin
    />

    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@type": "Person",
        "name": "Fatlind Azemi",
        "jobTitle": "Software & Data Engineer",
        "url": "https://fatlind-azemi.de",
        "sameAs": [
          "https://de.linkedin.com/in/fatlind-azemi-082624352",
          "https://github.com/FatlindAzemi"
        ]
      }
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
